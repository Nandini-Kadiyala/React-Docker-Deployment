name: Build and push docker image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build the Docker image
        run: docker build -t reactjs-app-image:latest -f Dockerfile .

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412a0b

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker tag & push the Docker image
        run: |
          docker tag reactjs-app-image:latest ${{ secrets.DOCKER_USERNAME }}/reactjs-app-image:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/reactjs-app-image:latest
